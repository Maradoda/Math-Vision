name: Unity Android Build (GitHub-Hosted)

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest # GitHubのVMを指定
    steps:
      # 1. リポジトリのソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # 3. Unityのライセンスを有効化
      - name: Activate Unity License
        uses: game-ci/unity-activate@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      # 4. Unityでビルドを実行
      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.50f1
          targetPlatform: Android
          buildName: YourGameName.apk
          buildsPath: build

      # 5. ビルド成果物(APK)をアップロード
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-Build-APK
          path: build/Android/YourGameName.apk
