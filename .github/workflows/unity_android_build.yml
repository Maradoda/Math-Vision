# 名前を付ける。これがGithubActions上に表示される
name: Run the Android build

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Run the Android build
    runs-on: ubuntu-latest
    steps:
      # ▼▼▼ここから追加▼▼▼
      # 1. ランナーのディスク空き容量を確保するためのクリーンアップ
      - name: Clean up runner to free disk space
        run: |
          echo "Initial disk space:"
          df -h

          # 不要なツールチェーンを削除して容量を確保
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          echo "Disk space after cleanup:"
          df -h
      # ▲▲▲ここまで追加▲▲▲

      # 2. リポジトリのチェックアウト
      - name: Check out my unity project.
        uses: actions/checkout@v4
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      # 3. LFSファイルのキャッシュを取得する
      - name: Restore LFS cache
        uses: actions/cache@v4 # v3からv4に更新
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      # 4. LFSファイルをPullする
      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      # 5. ファイル名にgitのハッシュを含めたいので$GITHUB_OUTPUTに保存しておく
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
      # 6. Libraryフォルダのキャッシュ
      - uses: actions/cache@v4 # v3からv4に更新
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 7. Unityプロジェクトのビルド
      - name: Run the Android build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # 補足：.ulfファイルを使う場合、EMAILとPASSWORDは不要です
          # UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          # UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.50f1

      # 8. 成果物をアップロードする
      - name: Upload the Android Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ steps.vars.outputs.sha_short }}
          path: build
