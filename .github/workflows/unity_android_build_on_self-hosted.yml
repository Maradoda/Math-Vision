# ワークフロー名
name: Unity Build for Android (Self-Hosted)

# ワークフローの実行トリガー
on:
  workflow_dispatch: {}

# 複数のワークフローが同時に実行されるのを防ぐ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # 実行環境をself-hostedランナーに指定
    runs-on: self-hosted

    steps:
      # 1. プロジェクトのチェックアウト
      - name: 1. Checkout Project
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. LFSキャッシュキーの準備
      - name: 2. Prepare LFS Cache Key
        run: |
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      # 3. LFSキャッシュの復元
      - name: 3. Restore LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: LFS-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            LFS-

      # 4. Unityプロジェクトのビルド
      - name: 4. Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.50f1
          customParameters: -EnableCacheServer -cacheServerEndpoint host.docker.internal:10080
          containerHookFiles: |
            --network unity-ci-net

      # 5. ビルド成果物のアップロード
      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android-${{ github.sha }}
          path: build

      # 6. 最終的なワークスペースのクリーンアップ
      - name: 6. Final Workspace Cleanup
        if: always()
        run: |
          echo "Fixing permissions for the entire _work directory..."
          sudo chown -R poka:poka /home/poka/actions-runner/_work
          echo "Permissions fixed for the entire work directory."
